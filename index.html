/* ---------- habits ---------- */
function loadLocalHabits(){ try{ const r = localStorage.getItem(HLS); if(r) JSON.parse(r).forEach(h=>habits.set(h.id,h)); }catch(e){} }
function hpersist(id){
  if(!hcol){ try{ localStorage.setItem(HLS, JSON.stringify([...habits.values()])); }catch(e){} return; }
  const key = "h:"+id, prev = queues.get(key) || Promise.resolve();
  const write = async ()=>{ const h = habits.get(id); if(h){ const {id:_, ...b} = h; await hcol.doc(id).set(b); } else { await hcol.doc(id).delete(); } };
  queues.set(key, prev.then(async ()=>{
    try{ await write(); }
    catch(e){
      if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await write(); }catch(_){ toast("Couldn't save that change. Check your connection."); } }
      else if(e && e.code==="quota_exceeded") toast("Storage is full.");
      else toast("Couldn't save that change.");
    }
  }));
}
function hupdate(id, patch){ const h = habits.get(id); if(!h) return; habits.set(id, Object.assign({}, h, patch)); hpersist(id); render(); }

function addDays(s,n){ const d = new Date(s+"T00:00"); d.setDate(d.getDate()+n); return ymd(d); }
function dow(s){ return new Date(s+"T00:00").getDay(); }
function weekStart(s){ return addDays(s, -dow(s)); }
function hStart(h){ return h.start || ymd(new Date(h.created)); }
function scheduledOn(h,s){ if(h.type==="quit" || h.sched!=="weekdays") return true; const w = dow(s); return w>0 && w<6; }
function shortDate(s){ return new Date(s+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

function habitStats(h){
  const t = todayStr(), log = h.log || {}, start = hStart(h), y = habitYear;
  const yStart = y+"-01-01", yEnd = (y+"-12-31" < t ? y+"-12-31" : t);
  const from = start > yStart ? start : yStart;
  const o = {};
  if(h.type==="quit"){
    let d = t, n = 0;
    while(d >= start && !log[d]){ n++; d = addDays(d,-1); }
    o.streak = n;
    let clean = 0, total = 0, best = 0, run = 0;
    for(let d = from; d <= yEnd; d = addDays(d,1)){ total++; if(log[d]) run = 0; else { clean++; run++; if(run > best) best = run; } }
    Object.assign(o, {clean, total, best});
  } else if(h.sched==="weekly"){
    const N = h.perWeek || 3;
    const cnt = ws => { let c = 0; for(let i=0;i<7;i++) if(log[addDays(ws,i)]) c++; return c; };
    const cw = weekStart(t), first = weekStart(start);
    o.thisWeek = cnt(cw);
    let ws = o.thisWeek >= N ? cw : addDays(cw,-7), n = 0;
    while(ws >= first && cnt(ws) >= N){ n++; ws = addDays(ws,-7); }
    o.streak = n;
    let done = 0; for(let d = from; d <= yEnd; d = addDays(d,1)) if(log[d]) done++;
    let hit = 0, weeks = 0;
    for(let w = weekStart(from); w <= yEnd; w = addDays(w,7)){ const c = cnt(w); if(c >= N){ hit++; weeks++; } else if(addDays(w,6) < t) weeks++; }
    Object.assign(o, {done, hit, weeks, N});
  } else {
    let d = (log[t] || !scheduledOn(h,t)) ? t : addDays(t,-1), n = 0;
    while(d >= start){ if(scheduledOn(h,d)){ if(log[d]) n++; else break; } d = addDays(d,-1); }
    o.streak = n;
    let done = 0, total = 0, best = 0, run = 0;
    for(let d = from; d <= yEnd; d = addDays(d,1)){
      if(!scheduledOn(h,d)) continue;
      if(d===t && !log[d]) continue;
      total++;
      if(log[d]){ done++; run++; if(run > best) best = run; } else run = 0;
    }
    Object.assign(o, {done, total, best});
  }
  return o;
}

function yearGrid(h){
  const y = habitYear, t = todayStr(), log = h.log || {}, start = hStart(h);
  const jan1 = y+"-01-01", lead = dow(jan1);
  const days = Math.round((new Date(y,11,31) - new Date(y,0,1))/864e5) + 1;
  const cols = Math.ceil((lead + days)/7);
  let cells = '<i class="h"></i>'.repeat(lead);
  for(let i=0, d=jan1; i<days; i++, d=addDays(d,1)){
    let c = "";
    if(d <= t && d >= start){
      if(h.type==="quit") c = log[d] ? "s" : "d";
      else if(scheduledOn(h,d)) c = log[d] ? "d" : (d===t ? "" : "m");
      else if(log[d]) c = "d";
    }
    if(d===t) c += " n";
    cells += `<i class="${c}"></i>`;
  }
  let months = "";
  for(let m=0; m<12; m++){
    const idx = Math.round((new Date(y,m,1) - new Date(y,0,1))/864e5);
    months += `<span style="grid-column:${Math.floor((lead+idx)/7)+1}">${new Date(y,m,1).toLocaleDateString(undefined,{month:"short"})}</span>`;
  }
  return `<div class="yr" style="grid-template-columns:repeat(${cols},minmax(0,1fr))" aria-hidden="true">${cells}</div><div class="mo" style="grid-template-columns:repeat(${cols},minmax(0,1fr))" aria-hidden="true">${months}</div>`;
}

function schedLabel(h){ return h.type==="quit" ? "Quitting" : h.sched==="weekdays" ? "Weekdays" : h.sched==="weekly" ? (h.perWeek||3)+"× a week" : "Every day"; }

function chipsHTML(attr, cur, opts){ return opts.map(([v,l])=>`<button class="chip" ${attr}="${v}" aria-pressed="${cur===v}">${l}</button>`).join(""); }
function swatchesHTML(attr, cur){ return Object.entries(HCOLORS).map(([k,c])=>`<button class="swatch" style="--c:${c}" ${attr}="${k}" aria-pressed="${cur===k}" aria-label="${k}"></button>`).join(""); }
function perWeekSelect(attr, cur){ return `<select class="txt" ${attr}>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===(cur||3)?"selected":""}>${n}× a week</option>`).join("")}</select>`; }

function habitCard(h){
  const t = todayStr(), c = HCOLORS[h.color] || "var(--term)", s = habitStats(h), log = h.log || {}, y = habitYear;
  const quit = h.type==="quit";
  let action, stats;
  if(quit){
    action = `<button class="hab-act slip" data-hact="today" aria-pressed="${!!log[t]}">${log[t] ? "Slipped today" : "I slipped"}</button>`;
    stats = [[s.streak, s.streak===1 ? "day clean" : "days clean"], [s.clean+"/"+s.total, "clean in "+y], [s.best, "best run"]];
  } else {
    const off = !scheduledOn(h,t) && !log[t];
    action = `<button class="hab-act" data-hact="today" aria-pressed="${!!log[t]}" ${off?"disabled":""}>${log[t] ? "Done ✓" : off ? "Off today" : "Mark done"}</button>`;
    if(h.sched==="weekly") stats = [[s.thisWeek+"/"+s.N, "this week"], [s.streak, s.streak===1 ? "week streak" : "weeks in a row"], [s.done, "days in "+y], [s.hit+"/"+s.weeks, "weeks hit"]];
    else stats = [[s.streak, "day streak"], [s.done+"/"+s.total, "days in "+y], [s.total ? Math.round(100*s.done/s.total)+"%" : "–", "hit rate"], [s.best, "best streak"]];
  }
  let editor = "";
  if(openHabit===h.id){
    const start = hStart(h);
    let strip = "";
    for(let i=13; i>=0; i--){
      const d = addDays(t,-i), dd = new Date(d+"T00:00");
      const dis = (quit && d < start) || (!quit && !scheduledOn(h,d) && !log[d]);
      strip += `<button class="sd ${quit?"slip":""}" data-hday="${d}" aria-pressed="${!!log[d]}" ${dis?"disabled":""} aria-label="${dd.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}">${dd.toLocaleDateString(undefined,{weekday:"narrow"})}<b>${dd.getDate()}</b></button>`;
    }
    editor = `<div class="hab-edit">
      <div class="lbl">${quit ? "Tap any day you slipped" : "Tap the days you did it"}</div>
      <div class="strip">${strip}</div>
      <div class="row"><span class="lbl">Older day:</span><input type="date" data-hfix max="${t}" aria-label="Fix an older day"></div>
      <label class="lbl">Name<input class="txt" data-hname value="${esc(h.name)}"></label>
      ${quit ? "" : `<div class="row">${chipsHTML("data-hsched", h.sched, [["daily","Every day"],["weekdays","Weekdays"],["weekly","Times a week"]])}${h.sched==="weekly" ? perWeekSelect("data-hper", h.perWeek) : ""}</div>`}
      <div class="row">${swatchesHTML("data-hcolor", h.color)}</div>
      <label class="lbl">${quit ? "Clean since" : "Started"}<input class="txt" type="date" data-hstart value="${start}" max="${t}"></label>
      <div class="edit"><div class="actions"><button class="btn danger" data-hact="delete">Delete habit</button><button class="btn primary" data-hact="close">Done</button></div></div>
    </div>`;
  }
  return `<div class="hab ${h.id===hFlash?"flash":""}" data-hid="${h.id}" style="--c:${c}">
    <div class="hab-top">
      <button class="hab-name" data-hact="open" aria-expanded="${openHabit===h.id}">${esc(h.name)}<span class="hab-sub">${schedLabel(h)}</span></button>
      ${action}
    </div>
    <div class="hab-stats" style="grid-template-columns:repeat(${stats.length},minmax(0,1fr))">${stats.map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    ${yearGrid(h)}
    ${editor}
  </div>`;
}

function newHabitHTML(){
  if(!newHabitOpen) return `<button class="addday" data-newhab>+ New habit</button>`;
  const d = hdraft, quit = d.type==="quit";
  return `<div class="hab" style="--c:${HCOLORS[d.color]}">

      <div class="row">${swatchesHTML("data-nhcolor", d.color)}</div>

function habitsHTML(){
  const list = [...habits.values()].sort((a,b)=>a.created-b.created);
  const cy = new Date().getFullYear();
  const minY = Math.min(cy, ...list.map(h=>+hStart(h).slice(0,4)));
  const head = minY < cy ? `<div class="calhead" style="margin:0 0 10px"><button class="navbtn" data-hnav="prev" ${habitYear<=minY?"disabled":""} aria-label="Previous year">‹</button><h2>${habitYear}</h2><button class="navbtn" data-hnav="next" ${habitYear>=cy?"disabled":""} aria-label="Next year">›</button></div>` : "";
  const intro = list.length ? "" : `<div class="empty" style="margin-bottom:10px">Track things you want to do more of, or stop doing.<br>Each one gets a streak, a yearly total, and a square for every day of the year.</div>`;
  return head + intro + list.map(habitCard).join("") + newHabitHTML();
}

function habitStrip(){
  const t = todayStr();
  const list = [...habits.values()].filter(h=>h.type!=="quit" && scheduledOn(h,t) && hStart(h) <= t).sort((a,b)=>a.created-b.created);
  if(!list.length) return "";
  return `<div class="group">Habits</div><div class="today-habits">${list.map(h=>`<button class="hchip ${h.id===hFlash?"flash":""}" style="--c:${HCOLORS[h.color]||"var(--term)"}" data-hid="${h.id}" data-hact="today" aria-pressed="${!!(h.log||{})[t]}">${esc(h.name)}</button>`).join("")}</div>`;
}

function toggleDay(id, d, announce){
  const h = habits.get(id); if(!h) return;
  const quit = h.type==="quit";
  if(quit && d < hStart(h)){ toast("That's before your clean-since date"); return; }
  const log = Object.assign({}, h.log || {});
  if(log[d]) delete log[d]; else log[d] = 1;
  const patch = {log};
  if(!quit && log[d] && d < hStart(h)) patch.start = d;
  if(!quit && log[d] && d===todayStr()) hFlash = id;
  hupdate(id, patch);
  hFlash = null;
  if(announce) toast((log[d] ? (quit ? "Slip logged" : "Marked done") : "Cleared")+" for "+shortDate(d));
}

function addHabit(){
  const d = hdraft, name = d.name.trim();
  if(!name){ toast("Give it a name first"); return; }
  const id = hcol ? hcol.doc().id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
  habits.set(id, {id, name, type:d.type, sched: d.type==="quit" ? "daily" : d.sched, perWeek:d.perWeek, color:d.color, start: d.start || todayStr(), log:{}, created: Date.now()});
  hpersist(id); newHabitOpen = false; hdraft = null; render(); toast("Habit added");
}

$("#list").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.hnav){ habitYear += b.dataset.hnav==="next" ? 1 : -1; return render(); }
  if(b.hasAttribute("data-newhab")){ newHabitOpen = true; hdraft = freshDraft(); render(); const n = document.querySelector('[data-nh="name"]'); if(n) n.focus(); return; }
  if(b.hasAttribute("data-nhcancel")){ newHabitOpen = false; hdraft = null; return render(); }
  if(b.hasAttribute("data-nhsave")) return addHabit();
  if(b.dataset.nhtype){ hdraft.type = b.dataset.nhtype; return render(); }
  if(b.dataset.nhsched){ hdraft.sched = b.dataset.nhsched; return render(); }
  if(b.dataset.nhcolor){ hdraft.color = b.dataset.nhcolor; return render(); }
  const card = b.closest("[data-hid]"); if(!card) return;
  const id = card.dataset.hid, h = habits.get(id); if(!h) return;
  const a = b.dataset.hact;
  if(a==="today") return toggleDay(id, todayStr());
  if(a==="open"){ openHabit = openHabit===id ? null : id; return render(); }
  if(a==="close"){ openHabit = null; return render(); }
  if(a==="delete"){
    lastHabitDeleted = h; lastDeleted = null; gLastDeleted = null;
    habits.delete(id); hpersist(id); openHabit = null; render();
    return toast("Deleted “"+h.name+"”", true);
  }
  if(b.dataset.hday) return toggleDay(id, b.dataset.hday);
  if(b.dataset.hsched) return hupdate(id, {sched:b.dataset.hsched});
  if(b.dataset.hcolor) return hupdate(id, {color:b.dataset.hcolor});
});
$("#list").addEventListener("input", e=>{
  if(e.target.dataset && e.target.dataset.gf){
    const k = e.target.dataset.gf; gDraft[k] = e.target.value;
    if(k==="miles" || k==="interval"){ const n = document.getElementById("gnext"); if(n) n.textContent = gNextText(); }

$("#list").addEventListener("change", e=>{
  const el = e.target;
  if(hdraft && el.dataset.nh==="start"){ hdraft.start = el.value || null; return; }
  if(hdraft && el.hasAttribute("data-nhper")){ hdraft.perWeek = +el.value; return; }
  const card = el.closest("[data-hid]"); if(!card) return;
  const id = card.dataset.hid;
  if(el.hasAttribute("data-hname")){ const v = el.value.trim(); if(v) hupdate(id, {name:v}); return; }
  if(el.hasAttribute("data-hper")) return hupdate(id, {perWeek:+el.value});
  if(el.hasAttribute("data-hstart")){ if(el.value) hupdate(id, {start:el.value}); return; }
  if(el.hasAttribute("data-hfix")){ if(el.value) toggleDay(id, el.value, true); return; }
});
$("#toastUndo").addEventListener("click", ()=>{
  if(!lastHabitDeleted) return;
  const h = lastHabitDeleted; lastHabitDeleted = null;

});

/* ---------- weather (AccuWeather connector) ---------- */
const WX_SERVER = "AccuWeather®";
const WX_DEFAULT_PLACES = [{name:"Palm Harbor, FL", key:"337601"}, {name:"Clearwater, FL", key:"332295"}];
const validPlaces = a => Array.isArray(a) ? a.filter(x=>x && typeof x.name==="string" && /^\d{1,12}$/.test(String(x.key))).map(x=>({name:x.name.slice(0,60), key:String(x.key)})).slice(0,10) : [];
let wxPlaces = (()=>{ try{ const v = validPlaces(JSON.parse(localStorage.getItem("glovebox-wx-places"))); return v.length ? v : WX_DEFAULT_PLACES.slice(); }catch(e){ return WX_DEFAULT_PLACES.slice(); } })();
let wxKey = (()=>{ try{ const k = localStorage.getItem("glovebox-wx-key") || (localStorage.getItem("glovebox-wx")==="work" ? "332295" : "337601"); return wxPlaces.some(p=>p.key===k) ? k : wxPlaces[0].key; }catch(e){ return wxPlaces[0].key; } })();
let wxMcp = null, wxUnsubs = [], settingsDoc = null;
let wxAdding = false, wxQuery = "", wxSearch = {state:"idle", results:[], err:null}, wxSearchTok = 0, wxSearchTimer = null;
const placeName = p => p.name.split(",")[0].replace(/^Downtown\s+/i, "");
const curPlace = () => wxPlaces.find(p=>p.key===wxKey) || wxPlaces[0];
const wx = {state:"idle", current:null, today:null, hourly:null, alerts:0, at:null, err:null};
const WX_DENIED = ["needs_reauth","server_not_connected","selection_required","not_in_manifest","blocked_by_policy","approval_required","server_not_found"];
const WX_OFF = ["not_granted","capability_disabled","capability_removed"];
async function startWeather(){
  if(!window.claude || !window.claude.use) return;
  try{ wxMcp = await claude.use("mcp"); }catch(e){}
  if(!wxMcp){ wx.state = "off"; return paintWx(); }
  watchWeather();
}
function watchWeather(){
  wxUnsubs.forEach(u=>{ try{ u(); }catch(e){} }); wxUnsubs = [];
  Object.assign(wx, {state:"loading", current:null, today:null, hourly:null, alerts:0, at:null, err:null});
  paintWx();
  const loc = wxKey, key = wxKey;
  const watch = (tool, extra, part)=> mcp_watch(tool, Object.assign({locationKey:key, unit:"imperial", lang:"en"}, extra||{}), ev=>{
    if(loc!==wxKey) return;
    if(ev.type==="data"){
      const p = ev.result && ev.result.payload;
      if(!p || typeof p!=="object") return;
      if(part==="current"){ wx.current = p.currentConditions || null; wx.alerts = Array.isArray(p.alerts) ? p.alerts.length : 0; }
      if(part==="today") wx.today = Array.isArray(p.dailyForecast) ? p.dailyForecast[0] || null : null;
      if(part==="hourly") wx.hourly = Array.isArray(p.hourlyForecast) ? p.hourlyForecast : null;
      wx.at = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
      wx.state = "ok"; wx.err = null;
    } else {
      const code = (ev.error && ev.error.code) || "upstream_error";
      wx.err = code;
      if(WX_OFF.includes(code)){ wx.state = "off"; }
      else if(WX_DENIED.includes(code)){ wx.current = wx.today = wx.hourly = null; wx.state = "denied"; }
      else if(wx.state!=="ok"){ wx.state = "error"; }
    }
    paintWx();
  });
  wxUnsubs.push(watch("widgets-current-claude", null, "current"));
  wxUnsubs.push(watch("widgets-todayTonightForecast-claude", {days:1}, "today"));
  wxUnsubs.push(watch("widgets-hourly-claude", null, "hourly"));
}
function mcp_watch(tool, params, handler){
  return wxMcp.watchTool(WX_SERVER, tool, {queryParams:params}, handler, {cache:{staleTime:10*60e3}, refetchInterval:15*60e3});
}
function paintWx(){ const b = document.getElementById("wxBody"); if(b) b.innerHTML = wxBodyHTML(); else { const w = document.getElementById("wx"); if(w) w.outerHTML = weatherHTML(); } }
function repaintPlaces(){ const el = document.getElementById("wxPlaces"); if(el) el.innerHTML = placesHTML(); }
function savePlaces(){
  try{ localStorage.setItem("glovebox-wx-places", JSON.stringify(wxPlaces)); localStorage.setItem("glovebox-wx-key", wxKey); }catch(e){}
  settingsData.wxPlaces = wxPlaces;
  if(settingsDoc) settingsDoc.set(settingsData).catch(()=>toast("Couldn't sync your weather places."));
}
function selectPlace(key){
  if(key===wxKey) return;
  wxKey = key; try{ localStorage.setItem("glovebox-wx-key", wxKey); }catch(e){}
  repaintPlaces(); if(wxMcp) watchWeather();
}
function placesHTML(){
  const row = `<div class="wx-locs">${wxPlaces.map(p=>`<button class="chip" data-wxkey="${esc(p.key)}" aria-pressed="${p.key===wxKey}">${esc(placeName(p))}</button>`).join("")}<button class="chip" data-wxadd aria-pressed="${wxAdding}">${wxAdding ? "Done" : "+ Place"}</button></div>`;
  if(!wxAdding) return row;
  return row + `<div class="wx-add">
    <input id="wxSearch" class="txt" placeholder="Search a city or zip" value="${esc(wxQuery)}" autocomplete="off" aria-label="Search for a place">
    <div id="wxResults">${wxResultsHTML()}</div>
    ${wxPlaces.length>1 ? `<div class="wx-saved">${wxPlaces.map(p=>`<button class="chip" data-wxdel="${esc(p.key)}">Remove ${esc(placeName(p))}</button>`).join("")}</div>` : ""}
  </div>`;
}
function wxResultsHTML(){
  const r = wxSearch;
  if(r.state==="searching") return `<div class="wx-msg">Searching…</div>`;
  if(r.state==="error") return `<div class="wx-msg">Search didn't go through. Try again in a moment.</div>`;
  if(r.state==="none") return `<div class="wx-msg">No match for "${esc(wxQuery)}". Try adding the state, like "Tampa, FL".</div>`;
  if(r.state!=="done") return "";
  return r.results.map(x=>{ const have = wxPlaces.some(p=>p.key===x.key); return `<button class="wx-res" data-wxpick="${esc(x.key)}" data-name="${esc(x.name)}" ${have?"disabled":""}>${have ? "Saved: " : "+ "}${esc(x.name)}</button>`; }).join("");
}
function runPlaceSearch(){
  const q = wxQuery.trim(), tok = ++wxSearchTok;
  if(q.length < 2){ wxSearch = {state:"idle", results:[], err:null}; const el = document.getElementById("wxResults"); if(el) el.innerHTML = ""; return; }
  wxSearch = {state:"searching", results:[], err:null};
  const paint = ()=>{ const el = document.getElementById("wxResults"); if(el) el.innerHTML = wxResultsHTML(); };
  paint();
  wxMcp.callTool(WX_SERVER, "widgets-search-claude", {queryParams:{query:q}}).then(res=>{
    if(tok!==wxSearchTok) return;
    const list = res && res.payload && Array.isArray(res.payload.results) ? res.payload.results : [];
    const results = list.filter(x=>x && typeof x.name==="string" && x.locationKey).map(x=>({name:x.name, key:String(x.locationKey)})).slice(0,6);
    wxSearch = {state: results.length ? "done" : "none", results, err:null}; paint();
  }).catch(err=>{ if(tok!==wxSearchTok) return; wxSearch = {state:"error", results:[], err:err && err.code}; paint(); });
}
function rainBar(pct){ return `<i style="width:${Math.max(0, Math.min(100, pct))}%"></i>`; }
function weatherHTML(){
  if(wx.state==="idle" || wx.state==="off") return `<div id="wx" hidden></div>`;
  return `<div id="wx"><div class="group">Weather</div><section class="wx" aria-label="Weather"><div id="wxPlaces">${placesHTML()}</div><div id="wxBody">${wxBodyHTML()}</div></section></div>`;
}
function wxBodyHTML(){
  let body;
  if(wx.state==="denied"){
    const msg = {
      server_not_connected: "AccuWeather isn't connected. Add it in claude.ai under Settings, Connectors.",
      needs_reauth: "AccuWeather needs to be reconnected in claude.ai under Settings, Connectors.",
      selection_required: "Choose which AccuWeather connection to use when Claude asks.",
    }[wx.err] || "Weather is turned off for this page. Reload to allow AccuWeather again.";
    body = `<div class="wx-msg">${msg}</div>`;
  } else if(wx.state==="loading" || (wx.state==="ok" && !wx.current && !wx.today)){
    body = `<div class="wx-msg">Getting the forecast…</div>`;
  } else if(wx.state==="error"){
    body = `<div class="wx-msg">Couldn't reach AccuWeather. It will try again in a few minutes.</div>`;
  } else {
    const c = wx.current || {}, d = wx.today && wx.today.day, n = wx.today && wx.today.night;
    const temp = c.temperatureValue!=null ? c.temperatureValue+"°" : (d && d.temperature!=null ? d.temperature+"°" : "--");
    const sub = [];
    if(c.realFeelValue!=null) sub.push("feels "+c.realFeelValue+"°");
    if(c.extended && c.extended.humidity) sub.push("humidity "+esc(String(c.extended.humidity)));
    const rain = d && d.rainProbabilityValue!=null ? d.rainProbabilityValue : null;
    const storm = d && d.extended && d.extended.thunderstormProbability ? esc(String(d.extended.thunderstormProbability)) : "";
    const hours = (wx.hourly || []).slice(0,6).map(h=>{
      const pct = parseInt(h.precip, 10) || 0;
      const t = String(h.dateTime||"").replace(" AM","a").replace(" PM","p");
      return `<div class="${pct>=50?"wet":""}"><span>${esc(t)}</span><b>${h.temperatureValue!=null?h.temperatureValue+"°":"--"}</b><span>${pct}%</span></div>`;
    }).join("");
    const when = wx.at ? new Date(wx.at).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : "";
    body = `<div class="wx-top">
        <div class="wx-temp">${temp}</div>
        <div class="wx-now"><div class="wx-phrase">${esc(String(c.phrase || (d && d.iconPhrase) || ""))}</div><div class="wx-sub">${sub.join(", ")}</div></div>
        <div class="wx-hl">${d && d.temperature!=null ? `<span class="hi">H ${d.temperature}°</span>` : ""}${n && n.temperature!=null ? `<span class="lo">L ${n.temperature}°</span>` : ""}</div>
      </div>
      ${wx.alerts ? `<div class="wx-alert">! ${wx.alerts} active weather alert${wx.alerts>1?"s":""} for ${esc(placeName(curPlace()))}</div>` : ""}
      ${d && d.phrase ? `<div class="wx-line">Today: ${esc(String(d.phrase))}</div>` : ""}
      ${rain!=null ? `<div class="wx-rain">Rain <span class="bar" aria-hidden="true">${rainBar(rain)}</span> ${rain}%${storm ? `<span class="storm">Storms ${storm}</span>` : ""}</div>` : ""}
      ${hours ? `<div class="wx-hours">${hours}</div>` : ""}
      ${n && n.phrase ? `<div class="wx-line dim">Tonight: ${esc(String(n.phrase))}${n.rainProbabilityValue!=null ? ", rain "+n.rainProbabilityValue+"%" : ""}</div>` : ""}
      <div class="wx-foot">${wx.err ? "Couldn't refresh. Showing " : "Updated "}${when} from AccuWeather</div>`;
  }
  return body;
}

const GLS = "glovebox-garage";

let garage = new Map(), gcol = null;

const gNum = v => { const n = parseInt(String(v==null ? "" : v).replace(/[^\d]/g, ""), 10); return isFinite(n) ? n : null; };
const gMi = n => n==null ? "--" : n.toLocaleString() + " mi";
const gDate = d => d ? new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"}) : "";
const sameType = (a,b) => String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();
function loadLocalGarage(){ try{ const r = localStorage.getItem(GLS); if(r) JSON.parse(r).forEach(g=>garage.set(g.id, g)); }catch(e){} }
function gpersist(id){
  if(!gcol){ try{ localStorage.setItem(GLS, JSON.stringify([...garage.values()])); }catch(e){} return; }
  const key = "g:"+id, prev = queues.get(key) || Promise.resolve();
  const write = async ()=>{ const g = garage.get(id); if(g){ const {id:_, ...b} = g; await gcol.doc(id).set(b); } else { await gcol.doc(id).delete(); } };
  queues.set(key, prev.then(async ()=>{
    try{ await write(); }
    catch(e){
      if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 800+Math.random()*800)); try{ await write(); }catch(_){ toast("Couldn't save that change. Check your connection."); } }
      else if(e && e.code==="quota_exceeded") toast("Storage is full.");
      else toast("Couldn't save that change.");
    }
  }));
}
const gNewId = () => gcol ? gcol.doc().id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));

function gDueInfo(d, v){
  const left = d.dueMiles!=null && v && v.miles!=null ? d.dueMiles - v.miles : null;
  const days = d.dueDate ? Math.round((new Date(d.dueDate+"T00:00") - new Date(todayStr()+"T00:00")) / 864e5) : null;
  let state = "ok";
  if((left!=null && left < 0) || (days!=null && days < 0)) state = "late";
  else if((left!=null && left <= 500) || (days!=null && days <= 14)) state = "soon";
  let label = "";
  if(left!=null) label = left < 0 ? Math.abs(left).toLocaleString()+" mi overdue" : left===0 ? "due now" : "in "+left.toLocaleString()+" mi";
  else if(days!=null) label = days < 0 ? (-days)+" day"+(days===-1?"":"s")+" overdue" : days===0 ? "due today" : "in "+days+" day"+(days===1?"":"s");
  if(left!=null && days!=null && state!=="late" && days <= 14) label += days < 0 ? "" : ", or "+(days===0 ? "today" : "in "+days+" day"+(days===1?"":"s"));
  return {left, days, state, label};
}
function gDuesFor(v){
  const rank = {late:0, soon:1, ok:2};
  return [...garage.values()].filter(g=>g.kind==="due" && g.vid===v.id).map(d=>({d, info:gDueInfo(d, v)}))
    .sort((a,b)=> rank[a.info.state]-rank[b.info.state] || ((a.info.left ?? 1e9) - (b.info.left ?? 1e9)) || ((a.info.days ?? 1e9) - (b.info.days ?? 1e9)));
}
function gUrgent(){
  const out = [];
  vehicles().forEach(v=> gDuesFor(v).forEach(x=>{ if(x.info.state!=="ok") out.push({v, ...x}); }));
  return out;
}
function gLastInterval(vid, type){
  const logs = [...garage.values()].filter(g=>g.kind==="log" && g.vid===vid && sameType(g.type, type) && g.interval).sort((a,b)=>b.created-a.created);

  if(a==="due"){ gPanel = "due"; gEditId = null; gDraft = {type:"", dueMiles:"", dueDate:"", notes:""}; return render(); }

    const type = String(gDraft.type||"").trim();
    if(!type){ toast("Pick or type a service"); return gFocus("gf-type"); }

      const miles = gNum(gDraft.miles), date = gDraft.date || todayStr(), notes = String(gDraft.notes||"").trim();

      const interval = gNum(gDraft.interval);
      gSet({id:gNewId(), kind:"log", vid:v.id, type, miles, date, notes, interval: interval || null, created:Date.now()});
      [...garage.values()].filter(g=>g.kind==="due" && g.vid===v.id && sameType(g.type, type)).forEach(g=>gDel(g.id));

      if(miles!=null && (v.miles==null || miles > v.miles)) gSet(Object.assign({}, garage.get(v.id) || v, {miles, milesAt:Date.now()}));

    gPanel = null; render(); return toast("Reminder added");
  }
}

function statusText(){
  const all = [...items.values()];
  let late = 0, due = 0;
  all.forEach(i=>{ const d = dueState(i); if(d==="late") late++; else if(d==="today") due++; });
  const t = todayStr();
  const left = [...habits.values()].filter(h=>h.type!=="quit" && h.sched!=="weekly" && hStart(h) <= t && scheduledOn(h,t) && !(h.log||{})[t]).length;
  const parts = [];
  if(late) parts.push(late+" overdue");
  if(due) parts.push(due+" due today");
  if(left) parts.push(left+" habit"+(left===1?"":"s")+" left");
  const carLate = gUrgent().filter(x=>x.info.state==="late").length;
  if(carLate) parts.push(carLate+" car service"+(carLate===1?"":"s")+" overdue");
  return parts.length ? parts.join(", ") : "all clear";
}
let statusShown = "", statusTok = 0;
function updateStatus(){
  const txt = statusText(), el = $("#statusTxt");
  if(!el || txt===statusShown) return;
  statusShown = txt; const tok = ++statusTok;
  if(reduceMotion){ el.textContent = txt; return; }
  let n = 0; el.textContent = "";
  (function step(){ if(tok!==statusTok) return; el.textContent = txt.slice(0, ++n); if(n < txt.length) setTimeout(step, 24); })();
}

const LOCK_MS = 30*60e3;

let lockInfo = (()=>{ try{ return validLock(JSON.parse(localStorage.getItem("glovebox-lock"))); }catch(e){ return null; } })();
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, v); }catch(e){} };

const markUnlocked = () => lsSet("glovebox-unlock", String(Date.now()));
async function waitLockKnown(ms){ const t0 = Date.now(); while(!lockKnown && Date.now()-t0 < ms) await sleep(60); }

async function digest(text){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h = [0x811c9dc5, 0x01000193, 0x9e3779b9, 0x85ebca6b];
    for(let i=0; i<text.length; i++) h = h.map((x,j)=>Math.imul(x ^ text.charCodeAt(i), 16777619 + j*2) >>> 0);
    return h.map(x=>x.toString(16).padStart(8,"0")).join("");
  }
}
async function checkPass(code){ return !!lockInfo && (await digest(lockInfo.salt+":"+code))===lockInfo.hash; }
function writeSettings(){ if(settingsDoc) settingsDoc.set(settingsData).catch(()=>toast("Couldn't sync that change. It's saved on this device.")); }
async function savePass(code){
  const salt = [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
  lockInfo = {salt, hash: await digest(salt+":"+code)};
  lsSet("glovebox-lock", JSON.stringify(lockInfo));
  settingsData.lock = lockInfo; writeSettings();
}
function clearPass(){
  lockInfo = null;
  try{ localStorage.removeItem("glovebox-lock"); }catch(e){}
  lsSet("glovebox-lock-skip", "1");
  delete settingsData.lock; writeSettings();
}

function termShow(){
  let el = document.getElementById("boot");
  if(!el){ el = document.createElement("div"); el.id = "boot"; el.className = "bootscreen"; el.innerHTML = '<pre id="bootlog"></pre><div class="bdaily" id="bootdaily" hidden></div>'; document.body.prepend(el); }
  el.hidden = false; el.classList.remove("out"); el.classList.add("live");
  const log = el.querySelector("#bootlog");
  let cursor = log.querySelector(":scope > .blk");
  if(!cursor){ cursor = document.createElement("span"); cursor.className = "blk"; log.appendChild(cursor); }
  T = {el, log, cursor, fast: reduceMotion};
  if(!el.dataset.wired){
    el.dataset.wired = "1";
    el.addEventListener("click", e=>{
      if(e.target.closest("button,input,#bootdaily")) return;
      const inp = el.querySelector(".tin"); if(inp) inp.focus(); else if(T) T.fast = true;
    });
  }
  return T;
}
async function tType(txt, speed, cls){
  if(!T) return;
  let host = null;
  let tn = null;
  if(cls){ host = document.createElement("span"); host.className = cls; T.cursor.before(host); tn = document.createTextNode(""); host.append(tn); }
  for(const ch of txt){
    if(tn) tn.appendData(ch); else T.cursor.before(ch);
    if(!T.fast) await sleep(speed || 9);
  }
}
function tAsk(label, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    T.el.classList.add("locked");
    const line = document.createElement("span"); line.className = "tline";
    const lab = document.createElement("span"); lab.textContent = label;
    const inp = document.createElement("input");
    Object.assign(inp, {className:"tin", type: opts.secret ? "password" : "text", autocomplete:"off", spellcheck:false});
    inp.setAttribute("autocapitalize","off"); inp.setAttribute("enterkeyhint","go"); inp.setAttribute("aria-label", label);
    line.append(lab, inp);
    (opts.actions || []).forEach(a=>{ const b = document.createElement("button"); b.type = "button"; b.className = "tbtn"; b.textContent = a.charAt(0).toUpperCase() + a.slice(1); b.addEventListener("click", ()=>done(null)); line.append(b); });
    T.cursor.before(line); T.cursor.hidden = true; T.fast = reduceMotion;
    setTimeout(()=>inp.focus(), 40);
    let fin = false;
    function done(v){
      if(fin) return; fin = true;
      const echo = document.createElement("span"); echo.className = "tdim";
      echo.textContent = "\n" + label + (v==null ? "" : ": " + (opts.secret ? "•".repeat(Math.min(v.length, 12)) : v)) + "\n";
      line.replaceWith(echo);
      T.cursor.hidden = false; resolve(v);
    }
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); done(inp.value); } });
  });
}
function termClose(){
  if(!T) return;
  const el = T.el; T = null;
  el.classList.add("out"); el.classList.remove("locked","live");
  setTimeout(()=>{ el.hidden = true; el.querySelector("#bootlog").innerHTML = ""; const d = el.querySelector("#bootdaily"); if(d){ d.innerHTML = ""; d.hidden = true; } el.classList.remove("out"); }, 380);
  const h1 = document.querySelector("h1"); h1.style.animation = "none"; void h1.offsetWidth; h1.style.animation = "";
}

async function unlockFlow(){
  let fails = 0;
  for(;;){
    const v = await tAsk("Passcode", {secret:true});
    if(v && await checkPass(v)){ await tType("Unlocked.\n", 16, "tdim"); markUnlocked(); return; }
    fails++;
    await tType("That's not it. Try again.\n", 14, "tbad");
    if(fails===3) await tType("Forgot it? Ask Claude in chat to reset your Glovebox passcode.\n", 6, "tdim");
    if(fails>=5){ await tType("Too many tries. Wait 30 seconds.\n", 10, "tbad"); await sleep(30000); fails = 3; }
  }
}
async function setupFlow(mode){   // mode: "first" | "set" | "change"
  const act = mode==="first" ? ["skip"] : ["cancel"];
  for(;;){
    const a = await tAsk(mode==="change" ? "New passcode (leave empty to turn the lock off)" : "New passcode", {secret:true, actions:act});
    if(a==null) return "cancel";
    if(a==="" && mode==="change"){ clearPass(); await tType("Lock turned off.\n", 12, "tdim"); return "off"; }
    if(a.length < 4){ await tType("Use at least 4 characters.\n", 10, "tbad"); continue; }
    const b = await tAsk("Confirm passcode", {secret:true, actions:["cancel"]});
    if(b==null) return "cancel";
    if(b!==a){ await tType("Those didn't match. Try again.\n", 10, "tbad"); continue; }
    await savePass(a); markUnlocked();
    await tType("Passcode saved. Glovebox will ask for it every time you open it.\n", 8, "tdim");
    return "saved";
  }
}

QUOTES.push(...MORE_QUOTES); WORDS.push(...MORE_WORDS);
function dayNumber(){ const n = new Date(); return Math.floor(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 864e5); }
// Each list plays through in a shuffled order, then reshuffles for the next round.
function dailyPick(list, salt){
  const n = list.length, day = Math.abs(dayNumber() - Date.UTC(2026, 9, 16) / 864e5), round = Math.floor(day / n), pos = day % n;
  let seed = ((round + 1) * 2654435761 ^ salt) >>> 0 || 1;
  const rnd = ()=>{ seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; };
  const order = [...Array(n).keys()];
  for(let i=n-1; i>0; i--){ const j = Math.floor(rnd() * (i+1)); [order[i], order[j]] = [order[j], order[i]]; }
  return list[order[pos]];
}
function todaysQuote(){ return dailyPick(QUOTES, 0x51ed); }
function todaysWord(){ return dailyPick(WORDS, 0x7a3c); }
/* ---------- saved quotes + words ---------- */
function validSaved(v){
  if(!v || typeof v!=="object") return null;
  const q = Array.isArray(v.quotes) ? v.quotes.filter(x=>x && typeof x.text==="string").map(x=>({text:x.text.slice(0,600), who:String(x.who||"").slice(0,160), at:+x.at||0})) : [];
  const w = Array.isArray(v.words) ? v.words.filter(x=>x && typeof x.word==="string").map(x=>({word:x.word.slice(0,60), pos:String(x.pos||""), say:String(x.say||""), def:String(x.def||"").slice(0,400), ex:String(x.ex||"").slice(0,400), at:+x.at||0})) : [];
  return {quotes:q.slice(0,500), words:w.slice(0,500)};
}
let savedQW = (()=>{ try{ return validSaved(JSON.parse(localStorage.getItem("glovebox-saved"))) || {quotes:[], words:[]}; }catch(e){ return {quotes:[], words:[]}; } })();
let savedUndo = null;
const isSavedQuote = q => savedQW.quotes.some(x=>x.text===q[0]);
const isSavedWord = w => savedQW.words.some(x=>x.word===w[0]);
function persistSaved(){
  try{ localStorage.setItem("glovebox-saved", JSON.stringify(savedQW)); }catch(e){}
  settingsData.saved = savedQW; writeSettings();
}
function toggleSave(kind){
  if(kind==="quote"){
    const q = todaysQuote();
    if(isSavedQuote(q)) savedQW.quotes = savedQW.quotes.filter(x=>x.text!==q[0]);
    else savedQW.quotes.unshift({text:q[0], who:q[1], at:Date.now()});
    persistSaved(); return isSavedQuote(q);
  }
  const w = todaysWord();
  if(isSavedWord(w)) savedQW.words = savedQW.words.filter(x=>x.word!==w[0]);
  else savedQW.words.unshift({word:w[0], pos:w[1], say:w[2], def:w[3], ex:w[4], at:Date.now()});
  persistSaved(); return isSavedWord(w);
}
const saveLabel = on => on ? "★ Saved" : "☆ Save";
function savedHTML(){
  const on = d => new Date(d).toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"});
  let h = "";
  h += `<div class="group">Saved quotes<span class="sub">${savedQW.quotes.length || ""}</span></div>` + (savedQW.quotes.length
    ? savedQW.quotes.map((x,i)=>`<section class="qcard"><p class="qc-q">“${esc(x.text)}”</p><p class="qc-who">— ${esc(x.who)}</p>
        <div class="qc-f"><span>Saved ${x.at ? on(x.at) : ""}</span><button class="gbtn" data-unq="${i}">Remove</button></div></section>`).join("")
    : `<div class="empty">No saved quotes yet. Tap ☆ Save next to the quote on the lock screen and it lands here.</div>`);
  h += `<div class="group">Saved words<span class="sub">${savedQW.words.length || ""}</span></div>` + (savedQW.words.length
    ? savedQW.words.map((x,i)=>`<section class="qcard"><p class="qc-w">${esc(x.word)}</p><p class="qc-say">${esc(x.pos)}, ${esc(x.say)}</p><p class="qc-def">${esc(x.def)}</p>${x.ex ? `<p class="qc-ex">“${esc(x.ex)}”</p>` : ""}
        <div class="qc-f"><span>Saved ${x.at ? on(x.at) : ""}</span><button class="gbtn" data-unw="${i}">Remove</button></div></section>`).join("")
    : `<div class="empty">No saved words yet. Tap ☆ Save next to the word on the lock screen to build your own vocabulary list.</div>`);
  return h;
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-save],[data-unq],[data-unw]"); if(!b) return;
  if(b.dataset.save){
    const on = toggleSave(b.dataset.save);
    b.setAttribute("aria-pressed", String(on)); b.textContent = saveLabel(on);
    if(b.closest("#boot")) b.blur();
    if(view==="saved" && !b.closest("#boot")) render();
    return;
  }
  const list = b.dataset.unq!=null ? "quotes" : "words", i = +(b.dataset.unq ?? b.dataset.unw);
  const rec = savedQW[list][i]; if(!rec) return;
  savedQW[list].splice(i, 1); persistSaved();
  savedUndo = {list, i, rec}; lastDeleted = null; lastHabitDeleted = null; gLastDeleted = null;
  render(); toast("Removed", true);
});
$("#toastUndo").addEventListener("click", ()=>{
  if(!savedUndo) return;
  const {list, i, rec} = savedUndo; savedUndo = null;
  savedQW[list].splice(Math.min(i, savedQW[list].length), 0, rec); persistSaved(); render(); hideToast();
});

async function showDaily(instant){
  const box = document.getElementById("bootdaily"); if(!box) return;
  const [q, who] = todaysQuote(), [w, pos, say, def, ex] = todaysWord();
  box.innerHTML = '<section class="bd-col" aria-label="Quote of the day"><div class="bd-h"><span>Quote</span><button class="bd-star" data-save="quote" aria-pressed="' + isSavedQuote([q]) + '">' + saveLabel(isSavedQuote([q])) + '</button></div><p class="bd-q" style="--qs:' + (q.length > 130 ? .74 : q.length > 100 ? .84 : q.length > 75 ? .93 : 1) + '"></p><p class="bd-who"></p></section>'
    + '<section class="bd-col" aria-label="Word of the day"><div class="bd-h"><span>Word</span><button class="bd-star" data-save="word" aria-pressed="' + isSavedWord([w]) + '">' + saveLabel(isSavedWord([w])) + '</button></div><p class="bd-w" style="--wl:' + w.length + '"></p><p class="bd-pos"></p><p class="bd-say"></p><p class="bd-def"></p><p class="bd-ex"></p></section>';
  box.hidden = false;
  const fill = async (sel, txt, speed)=>{
    const el = box.querySelector(sel); if(!el) return;
    if(instant || reduceMotion){ el.textContent = txt; return; }
    for(const ch of txt){ if(box.hidden || !box.isConnected) return; el.textContent += ch; await sleep(speed); }
  };
  await Promise.all([
    (async()=>{ await fill(".bd-q", '“' + q + '”', 12); await fill(".bd-who", "— " + who, 7); })(),
    (async()=>{ await fill(".bd-w", w, 34); await fill(".bd-pos", pos, 7); await fill(".bd-say", say, 7); await fill(".bd-def", def, 11); await fill(".bd-ex", '“' + ex + '”', 7); })()
  ]);
}

function todayLabel(){ return new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"}); }
function greeting(){
  const h = new Date().getHours(), i = h < 12 ? 0 : h < 17 ? 1 : 2;
  // line widths in em (Space Grotesk 600): first line for two-line phones, whole greeting for one-line wide screens
  const b = document.getElementById("boot"); if(b){ b.style.setProperty("--gw", [6.47, 7.23, 6.29][i]); b.style.setProperty("--gw1", [9.36, 10.12, 9.18][i]); }
  return ["Good morning", "Good afternoon", "Good evening"][i] + ",\nCaleb.";
}
async function runBoot(){
  const el = $("#boot");
  const wantBoot = !reduceMotion && Date.now() - (+lsGet("glovebox-boot") || 0) >= LOCK_MS;
  const needLock = true;   // passcode on every entry
  if(!wantBoot){
    if(!lockInfo){ if(el) el.classList.add("live"); await waitLockKnown(3500); }
    if(!lockInfo){ if(el){ el.classList.remove("live"); el.hidden = true; } return; }
    termShow(); T.el.classList.add("locked");
    await tType(greeting(), 18, "tgreet");
    await tType(todayLabel(), 8, "tdate");
    await tType("Glovebox is locked.\n", 10, "tdim");
    await showDaily(true);
    await unlockFlow(); await sleep(450); return termClose();
  }
  lsSet("glovebox-boot", String(Date.now()));
  termShow();
  await tType(greeting(), 34, "tgreet"); if(!T.fast) await sleep(250);
  await tType(todayLabel(), 10, "tdate");
  for(let w=0; w<12 && !(syncedItems && syncedHabits) && !T.fast; w++) await sleep(80);
  const open = [...items.values()].filter(i=>!i.done && i.kind!=="event").length, hs = habits.size;
  await tType(open+" open item"+(open===1?"":"s")+", "+hs+" habit"+(hs===1?"":"s")+"\n", 10, "tdim");
  const daily = showDaily(false);
  let prompted = false;
  if(needLock){
    if(!lockInfo) await waitLockKnown(3500);
    if(lockInfo){ prompted = true; await unlockFlow(); }
    else if(!lsGet("glovebox-lock-skip")){
      prompted = true;
      await tType("\nSet a passcode to lock Glovebox, or skip for now.\n", 8, "tdim");
      const r = await setupFlow("first");
      if(r==="cancel"){ lsSet("glovebox-lock-skip", "1"); await tType("Skipped. You can set one later from Lists.\n", 10, "tdim"); }
    }
  }
  if(!T.fast) await sleep(140);
  await daily;
  if(prompted) await sleep(T && T.fast ? 250 : 600);
  else for(let t = 0; t < 2600 && T && !T.fast; t += 100) await sleep(100);   // time to read; tap to skip
  termClose();
}

async function passSettings(){
  if(T) return;
  termShow(); T.el.classList.add("locked");
  if(lockInfo){
    await tType("Change passcode", 14, "tgreet");
    const cur = await tAsk("Current passcode", {secret:true, actions:["cancel"]});
    if(cur==null){ await tType("Cancelled.\n", 10, "tdim"); }
    else if(!(await checkPass(cur))){ await tType("Wrong passcode.\n", 12, "tbad"); }
    else { const r = await setupFlow("change"); if(r==="cancel") await tType("Cancelled.\n", 10, "tdim"); }
  } else {
    await tType("Set a passcode", 14, "tgreet");
    const r = await setupFlow("set"); if(r==="cancel") await tType("Cancelled.\n", 10, "tdim");
  }
  await sleep(600); termClose();
}
$("#passBtn").addEventListener("click", passSettings);
$("#toastUndo").addEventListener("click", ()=>{
  if(!gLastDeleted) return;
  const recs = gLastDeleted; gLastDeleted = null;
  recs.forEach(g=>{ garage.set(g.id, g); gpersist(g.id); });
  const v = recs.find(g=>g.kind==="vehicle"); if(v) gVehicle = v.id;
  render(); hideToast();
});
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(lockInfo && !T && hiddenAt && Date.now() - hiddenAt >= 15e3){
    termShow(); T.el.classList.add("locked");
    tType(greeting(), 18, "tgreet").then(()=>tType(todayLabel(), 8, "tdate")).then(()=>tType("Glovebox is locked.\n", 10, "tdim")).then(()=>showDaily(true)).then(unlockFlow).then(()=>sleep(450)).then(termClose);
  }
});

function tick(){
  const n = new Date();
  $("#clock").textContent = n.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+"  "+n.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
tick(); setInterval(tick, 15000);
setInterval(()=>runRepeats(), 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) runRepeats(); });
loadLocal(); loadLocalHabits(); loadLocalGarage(); loadLocalRepeats(); syncCapture(); render(); connect(); runBoot(); startWeather();
